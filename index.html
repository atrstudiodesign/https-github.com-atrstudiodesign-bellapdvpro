    <script>
      // Ignorar avisos benignos de WebSocket do Vite HMR no ambiente proxy do AI Studio
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            msg += ' ' + ((arg && (arg.message || arg.stack || String(arg))) || '');
          }
          if (msg.indexOf('WebSocket closed without opened') !== -1 || (msg.indexOf('WebSocket') !== -1 && msg.indexOf('@vite/client') !== -1)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(registration => {
              // Verificar atualizações do Service Worker
              registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] Nova versão do Bella PDV pronta.');
                    }
                  };
                }
              };
            })
            .catch(err => {
              console.warn('[PWA] Falha ao registrar ServiceWorker:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
