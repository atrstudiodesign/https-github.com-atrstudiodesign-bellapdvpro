<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BellaPDV Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 4%,#153567 0%,#07172f 50%,#050c1a 100%);color:#fff;font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden}
main{height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;border:1px solid #1e446a}
.brand{display:flex;align-items:center;gap:14px}.symbol{width:64px;height:64px;display:grid;place-items:center;border-radius:19px;border:1px solid #3ca4ef;background:linear-gradient(145deg,#0d3169,#092044);box-shadow:0 0 45px #087cff55;color:#68dfff;font-size:39px;font-weight:800}
h1{font-size:29px;letter-spacing:-1.2px;margin:0}h1 span{color:#4addf2}h1 small{font-size:12px;letter-spacing:2px;color:#b3cdf3;margin-left:5px}.subtitle{font-size:11px;letter-spacing:2px;color:#aac4df}
.bar{width:230px;height:3px;background:#1b3557;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#2585ff,#4de6ee);border-radius:8px;animation:slide 1.5s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(600%)}}@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
footer{position:absolute;bottom:21px;color:#7d9bbf;font-size:11px} .status{color:#bfd2e8;font-size:12px}
</style></head><body><main role="status" aria-live="polite"><div class="brand"><div class="symbol" aria-hidden="true">B</div><h1>Bella<span>PDV</span><small>PRO</small></h1></div><div class="subtitle">DESKTOP EDITION</div><div class="bar" aria-hidden="true"><i></i></div><div class="status">Iniciando ambiente seguro…</div><footer>Desenvolvido por ATR Studio</footer></main></body></html>
