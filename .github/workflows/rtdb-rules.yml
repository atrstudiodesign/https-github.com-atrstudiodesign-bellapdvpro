name: Firebase rules isolation

on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firestore.rules'
      - 'firebase.json'
      - 'scripts/test-rtdb-rules.mjs'
      - 'scripts/test-firestore-rules.mjs'
      - 'scripts/assign-company-claim.py'
      - 'src/store/auth.ts'
      - 'src/main.tsx'
      - 'src/pages/**'
      - 'src/services/**'
      - 'src/components/**'
      - 'src/hooks/**'
      - 'src/store/**'
      - '.github/workflows/rtdb-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint && npm run build
      - run: python3 -m py_compile scripts/assign-company-claim.py
      - run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing@5
      - run: npx firebase emulators:exec --only database --project demo-bellapdv-p0 'node --test scripts/test-rtdb-rules.mjs'
      - run: npx firebase emulators:exec --only firestore --project demo-bellapdv-p0 'node --test scripts/test-firestore-rules.mjs'
