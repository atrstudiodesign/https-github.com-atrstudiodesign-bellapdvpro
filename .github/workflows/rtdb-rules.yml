name: RTDB rules isolation

on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'scripts/test-rtdb-rules.mjs'
      - '.github/workflows/rtdb-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing@5
      - run: npx firebase emulators:exec --only database --project demo-bellapdv-p0 'node --test scripts/test-rtdb-rules.mjs'
