name: Windows Installer BellaPDV Pro
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'package.json'
      - 'src/components/StartupScreen.tsx'
      - 'src/main.tsx'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Compile Windows installer
        run: npm run electron:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer for internal testing
        uses: actions/upload-artifact@v4
        with:
          name: BellaPDV-Pro-Windows-Setup-Unsigned
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 7
